<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator" role="main" aria-labelledby="title">
            <h1 id="title">Age Calculator<br><span> Using JavaScript</span></h1>
            <div class="input-box">
                <label for="date" class="sr-only">Birth date</label>
                <input type="date" id="date" aria-describedby="hint" required>
                <button id="calculate-btn" type="button">Calculate</button>
            </div>
            <p id="hint" class="hint">Pick your date of birth and press Calculate.</p>
            <p id="result" aria-live="polite"></p>
            <p id="next-birthday" class="next-birthday" aria-live="polite"></p>
        </div>
    </div>
<script>
const userInput = document.getElementById("date");
const calculateBtn = document.getElementById("calculate-btn");
const result = document.getElementById("result");
const nextBirthday = document.getElementById("next-birthday");

userInput.max = new Date().toISOString().split("T")[0];

calculateBtn.addEventListener("click", calculateAge);
userInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        calculateAge();
    }
});

function calculateAge() {
    if (!userInput.value) {
        result.textContent = "Please select your birth date.";
        nextBirthday.textContent = "";
        return;
    }

    const birthDate = new Date(`${userInput.value}T00:00:00`);
    const today = new Date();

    if (Number.isNaN(birthDate.getTime()) || birthDate > today) {
        result.textContent = "Please enter a valid date in the past.";
        nextBirthday.textContent = "";
        return;
    }

    let years = today.getFullYear() - birthDate.getFullYear();
    let months = today.getMonth() - birthDate.getMonth();
    let days = today.getDate() - birthDate.getDate();

    if (days < 0) {
        months -= 1;
        days += getDaysInMonth(today.getFullYear(), today.getMonth());
    }

    if (months < 0) {
        years -= 1;
        months += 12;
    }

    result.innerHTML = `You are <span>${years}</span> years, <span>${months}</span> months, and <span>${days}</span> days old.`;

    const upcomingBirthday = getNextBirthday(birthDate, today);
    const daysUntilBirthday = Math.ceil((upcomingBirthday - today) / (1000 * 60 * 60 * 24));
    const birthdayLabel = upcomingBirthday.toLocaleDateString(undefined, {
        month: "long",
        day: "numeric",
        year: "numeric"
    });

    if (daysUntilBirthday === 0) {
        nextBirthday.textContent = "🎉 Happy Birthday!";
    } else {
        nextBirthday.textContent = `Your next birthday is on ${birthdayLabel} (${daysUntilBirthday} day${daysUntilBirthday === 1 ? "" : "s"} away).`;
    }
}

function getDaysInMonth(year, monthIndex) {
    return new Date(year, monthIndex + 1, 0).getDate();
}

function getNextBirthday(birthDate, today) {
    const next = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
    next.setHours(0, 0, 0, 0);

    if (next < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
        next.setFullYear(today.getFullYear() + 1);
    }

    return next;
}
</script>
</body>
</html>
